name: Test and deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# One run per ref; on master a newer push waits rather than cancelling a rollout mid-way.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Deploy target comes from Actions repository variables (set from the infrastructure repo's terragrunt output).
env:
  PROJECT: ${{ vars.GCP_PROJECT }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: remote-retro
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/remote-retro/app

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.4"
          otp-version: "28.5.0.7"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

      - run: npm ci --prefix assets
      - run: npm run typecheck --prefix assets
      - run: npm test --prefix assets

  deploy:
    needs: test
    # PRs only run the tests. GCP also only trusts refs/heads/master (deploy/setup-github.sh).
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      id-token: write # for Workload Identity Federation
    steps:
      - name: Check deploy variables
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOYER_SA: ${{ vars.GCP_DEPLOYER_SA }}
        run: |
          for v in GCP_PROJECT GCP_REGION GCP_WIF_PROVIDER GCP_DEPLOYER_SA; do
            [ -n "${!v}" ] || { echo "::error::Actions repository variable $v is not set"; missing=1; }
          done
          exit "${missing:-0}"

      - uses: actions/checkout@v7

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: access_token

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: google-github-actions/setup-gcloud@v3

      # Only the image changes; env vars, secrets, scaling and Cloud SQL wiring set by
      # deploy/deploy.sh carry over to the new revision.
      - name: Deploy to Cloud Run
        run: >-
          gcloud run deploy "$SERVICE" --project "$PROJECT" --region "$REGION"
          --image "$IMAGE:${{ github.sha }}" --quiet
